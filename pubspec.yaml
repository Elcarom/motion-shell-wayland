name: motion_shell
description: A Material 3 Expressive desktop shell foundation for Hyprland.
publish_to: none
version: 0.3.0+3

environment:
  sdk: '>=3.9.2 <4.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/

dependencies:
  motion_layer_shell:
    path: native/linux_plugins/motion_layer_shell
  flutter:
    sdk: flutter
  image: ^4.9.1
  icon_button_m3e: ^0.2.1
  loading_indicator_m3e: ^0.1.1
  material_color_utilities: ^0.13.0
  m3e_buttons: ^0.0.4
  m3e_design: ^0.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
