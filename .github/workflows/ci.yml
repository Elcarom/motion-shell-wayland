name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libgtk-layer-shell-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: ./scripts/prepare-linux-runner.sh
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib bin test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux --release
      - run: dart compile exe bin/motion_service.dart -o build/motion-service
