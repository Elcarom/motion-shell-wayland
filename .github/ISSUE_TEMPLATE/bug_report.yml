name: Bug report
description: Report a reproducible Motion Shell defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Motion Shell. Remove private data from logs before submitting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start Motion Shell...
        2. Open...
        3. Observe...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Version or commit
      placeholder: 0.3.0 or commit SHA
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: CachyOS, Hyprland version, Flutter version, GPU
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials and private information from logs.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
