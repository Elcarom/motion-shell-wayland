# Motion Shell integration. The state service and bar are systemd user units.
exec-once = systemctl --user start motion-shell.target
exec-once = systemctl --user start hyprpolkitagent.service
exec-once = systemctl --user import-environment WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP

# Material-first shell flows.
bind = SUPER, SPACE, exec, uwsm app -- motion-shell --surface=launcher
bind = SUPER, A, exec, uwsm app -- motion-shell --surface=quick-settings
bind = SUPER, N, exec, uwsm app -- motion-shell --surface=notifications
bind = SUPER, W, exec, uwsm app -- motion-shell --surface=overview
bind = SUPER, S, exec, uwsm app -- motion-shell --surface=search
bind = SUPER, COMMA, exec, uwsm app -- motion-shell --surface=settings

# Safe media and display keys. Commands are centralized in deployment config; OSD subscribes through the state service in the next increment.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Cohesive session services.
exec-once = systemctl --user start hypridle.service
exec-once = systemctl --user start hyprpaper.service
