general {
    hide_cursor = true
    immediate_render = true
    fractional_scaling = 2
}

auth {
    pam:enabled = true
    pam:module = hyprlock
}

animations {
    enabled = true
    bezier = motion, 0.2, 0.0, 0.0, 1.0
    animation = fade, 1, 2.2, motion
    animation = inputField, 1, 2.8, motion
}

background {
    monitor =
    path = ~/.local/share/motion-shell/wallpaper.png
    color = rgba(24, 20, 28, 1.0)
    blur_passes = 1
    blur_size = 4
    brightness = 0.55
}

shape {
    monitor =
    size = 520, 360
    color = rgba(33, 30, 38, 0.96)
    rounding = 36
    border_size = 1
    border_color = rgba(202, 196, 208, 0.45)
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(243, 237, 247, 1.0)
    font_size = 58
    font_family = Roboto
    position = 0, 96
    halign = center
    valign = center
}

label {
    monitor =
    text = Welcome back, $USER
    color = rgba(202, 196, 208, 1.0)
    font_size = 17
    font_family = Roboto
    position = 0, 42
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 400, 60
    outline_thickness = 0
    inner_color = rgba(73, 69, 79, 1.0)
    font_color = rgba(243, 237, 247, 1.0)
    check_color = rgba(208, 188, 255, 1.0)
    fail_color = rgba(242, 184, 181, 1.0)
    capslock_color = rgba(255, 216, 178, 1.0)
    placeholder_text = <span foreground="##CAC4D0">Password</span>
    fail_text = <span foreground="##F2B8B5">$FAIL</span>
    dots_center = true
    fade_on_empty = false
    rounding = 30
    position = 0, -38
    halign = center
    valign = center
}

label {
    monitor =
    text = Press Enter to unlock · Esc clears input
    color = rgba(202, 196, 208, 1.0)
    font_size = 13
    font_family = Roboto
    position = 0, -96
    halign = center
    valign = center
}
